[project]
name = "llmfuse"
version = "0.1.0"
description = "Reliability for LLM calls: retries with backoff, circuit breakers, rate limiting and multi-provider failover."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaryan Bairagi", email = "aaryanbairagi11@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "retry", "backoff", "circuit-breaker", "rate-limit", "failover", "openai", "anthropic", "gemini", "groq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/AaryanBairagi/llmfuse"
Repository = "https://github.com/AaryanBairagi/llmfuse"
Issues = "https://github.com/AaryanBairagi/llmfuse/issues"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=9.1.1", "ruff>=0.16.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]