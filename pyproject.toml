[project]
name = "llmfuse"
version = "0.1.0"
description = "Reliability for LLM calls: retries with backoff, circuit breakers, rate limiting and multi-provider failover."
readme = "README.md"
authors = [
    { name = "AaryanBairagi", email = "aaryanbairagi11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []


[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
